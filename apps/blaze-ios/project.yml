# Blaze Wallet for iOS. Generate the Xcode project with `xcodegen` in this folder; BlazeWallet.xcodeproj is git-ignored.
name: BlazeWallet
options:
  bundleIdPrefix: rocks.charisma
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Without this SwiftUI text isn't extracted into Localizable.xcstrings (Xcode's default and XcodeGen's are off)
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
    # Ross's Apple Developer team id: needed to run on a real iPhone and to upload to TestFlight
    DEVELOPMENT_TEAM: N43YPKPS99
    # The build number; scripts/testflight.sh sets each upload's own
    CURRENT_PROJECT_VERSION: "1"
packages:
  BlazeKit:
    path: BlazeKit
  # Draws SVG token logos, which SwiftUI's own image views can't (Zlib license, no dependencies)
  SwiftDraw:
    url: https://github.com/swhitty/SwiftDraw
    exactVersion: 0.29.0
targets:
  BlazeWallet:
    type: application
    platform: iOS
    sources:
      - path: BlazeWallet
    dependencies:
      - package: BlazeKit
        product: StacksKit
      - package: BlazeKit
        product: WalletCore
      - package: SwiftDraw
        product: SwiftDraw
    info:
      path: BlazeWallet/Info.plist
      properties:
        CFBundleDisplayName: Blaze Wallet
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        NSFaceIDUsageDescription: Blaze Wallet uses Face ID to unlock your wallet.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: bg
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [DMMono-Regular.woff2, DMMono-Medium.woff2, YsabeauInfant.woff2, YsabeauInfant-Italic.woff2, Matter-Regular.woff2, Matter-Medium.woff2]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: rocks.charisma.blazewallet
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
